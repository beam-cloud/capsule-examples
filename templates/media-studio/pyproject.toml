[project]
name = "{{ project_slug }}"
version = "0.1.0"
description = "A Capsule media generation studio powered by fal.ai and BAML."
requires-python = ">=3.13"
dependencies = [
    "baml-py==0.220.0",
    "cpsl>=0.3.44",
    "fal-client>=0.7.0",
    "pydantic>=2.13.2",
]

[tool.setuptools]
py-modules = ["app", "prompts"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
