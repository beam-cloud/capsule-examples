[project]
name = "{{ project_slug }}"
version = "0.1.0"
description = "The default Capsule starter app."
requires-python = ">=3.13"
dependencies = [
    "baml-py==0.220.0",
    "cpsl>=0.3.48",
    "pydantic>=2.13.2",
]

[tool.setuptools]
py-modules = ["app"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
