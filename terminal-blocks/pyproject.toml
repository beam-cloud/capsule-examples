[project]
name = "{{ project_slug }}"
version = "0.1.0"
description = "A simple Capsule app that demonstrates terminal blocks."
requires-python = ">=3.13"
dependencies = [
    "cpsl>=0.3.91",
]

[tool.setuptools]
py-modules = ["app"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
