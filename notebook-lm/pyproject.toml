[project]
name = "{{ project_slug }}"
version = "0.1.0"
description = "A NotebookLM-style Capsule app with sources and custom chat."
requires-python = ">=3.13"
dependencies = [
    "cpsl>=0.3.80",
]

[tool.setuptools]
py-modules = ["app"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
